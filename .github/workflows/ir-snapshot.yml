name: Snapshot IR

# Sleeper never reports when a player was placed on IR, so the only way to know
# how long he sat there is to look while it is happening. A week counts only if
# he is on IR that Sunday, so the job runs repeatedly on Sundays: scheduled runs
# can start hours late or be dropped entirely, and re-running is harmless. In
# practice roughly a third of them never fire, so the extra attempts are what
# keep a week from being lost. All of them land on Sunday in New York even when
# delayed by a few hours.
#
# A Sunday with no run at all is caught the next day by ir-audit.yml.
on:
  schedule:
    - cron: '0 13,16,19,22 * * 0' # Sundays, every three hours, 13:00-22:00 UTC
  workflow_dispatch: # allow a manual run

permissions:
  contents: write

# Never let two runs commit at once.
concurrency:
  group: ir-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/snapshot-ir.mjs
      - name: Commit the ledger if it changed
        run: |
          if [ -z "$(git status --porcelain src/data/irLedger.json)" ]; then
            echo "No change to record."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/irLedger.json
          git commit -m "Record IR snapshot for $(date -u +%Y-%m-%d)"
          git push

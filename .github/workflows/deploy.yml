name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # The snapshot job pushes with GITHUB_TOKEN, and those pushes never trigger
  # other workflows, so redeploy explicitly once it finishes.
  workflow_run:
    workflows: ["Snapshot IR"]
    types: [completed]

permissions:
  contents: write

jobs:
  build-and-deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
